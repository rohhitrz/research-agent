<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        header span {
            font-size: 12px;
            color: #666;
        }

        #clear-btn {
            background: transparent;
            border: 1px solid #333;
            color: #888;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        #clear-btn:hover {
            border-color: #666;
            color: #ccc;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message.user {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            align-self: flex-end;
            color: #c0c8ff;
        }

        .message.agent {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            align-self: flex-start;
            color: #e0e0e0;
        }

        .message.error {
            background: #1a0a0a;
            border: 1px solid #4a1a1a;
            align-self: flex-start;
            color: #ff8080;
        }

        .meta {
            font-size: 11px;
            color: #444;
            margin-top: 6px;
            display: flex;
            gap: 12px;
        }

        .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .thinking {
            align-self: flex-start;
            color: #555;
            font-size: 13px;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        #input-area {
            padding: 16px 24px;
            border-top: 1px solid #222;
            display: flex;
            gap: 12px;
        }

        #user-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
            resize: none;
            height: 48px;
            font-family: inherit;
        }

        #user-input:focus {
            border-color: #555;
        }

        #send-btn {
            background: #2a2a6a;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #send-btn:hover {
            background: #3a3a8a;
        }

        #send-btn:disabled {
            background: #222;
            color: #555;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            color: #444;
            margin: auto;
        }

        .welcome h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #666;
        }

        .welcome p {
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>🔍 Research Agent</h1>
    <div style="display:flex; align-items:center; gap:16px;">
        <span id="session-stats"></span>
        <button id="clear-btn" onclick="clearMemory()">Clear Memory</button>
    </div>
</header>

<div id="chat-window">
    <div class="welcome">
        <h2>Research Agent</h2>
        <p>Ask me anything — I'll search the web and remember our conversation.</p>
    </div>
</div>

<div id="input-area">
    <textarea
        id="user-input"
        placeholder="Ask me anything..."
        onkeydown="handleKey(event)"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
</div>

<script>
    let totalTokens = 0;
    let totalCost = 0;

    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const sessionStats = document.getElementById('session-stats');

    function handleKey(e) {
        // Send on Enter, new line on Shift+Enter
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function appendMessage(role, content, meta = null) {
        // Remove welcome message on first message
        const welcome = document.querySelector('.welcome');
        if (welcome) welcome.remove();

        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = content;

        if (meta) {
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            metaDiv.innerHTML = `
                <span>⚡ ${meta.steps} steps</span>
                <span>🔧 ${meta.tools_used.join(', ') || 'no tools'}</span>
                <span>🪙 ${meta.tokens} tokens</span>
                <span>💰 $${meta.cost}</span>
            `;
            div.appendChild(metaDiv);
        }

        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
        return div;
    }

    function updateSessionStats() {
        sessionStats.textContent = `Session: ${totalTokens} tokens · $${totalCost.toFixed(4)}`;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Show user message
        appendMessage('user', message);
        userInput.value = '';
        sendBtn.disabled = true;

        // Show thinking indicator
        const thinking = document.createElement('div');
        thinking.className = 'thinking';
        thinking.textContent = 'Agent is thinking...';
        chatWindow.appendChild(thinking);
        chatWindow.scrollTop = chatWindow.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message})
            });

            thinking.remove();

            if (!response.ok) {
                const error = await response.json();
                appendMessage('error', `Error: ${error.detail}`);
                return;
            }

            const data = await response.json();

            // Update session totals
            totalTokens += data.tokens;
            totalCost += data.cost;
            updateSessionStats();

            // Show agent response with metadata
            appendMessage('agent', data.response, {
                steps: data.steps,
                tools_used: data.tools_used,
                tokens: data.tokens,
                cost: data.cost
            });

        } catch (err) {
            thinking.remove();
            appendMessage('error', 'Network error — is the server running?');
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    async function clearMemory() {
        await fetch('/memory', {method: 'DELETE'});
        chatWindow.innerHTML = `
            <div class="welcome">
                <h2>Research Agent</h2>
                <p>Memory cleared. Start a fresh conversation.</p>
            </div>
        `;
        totalTokens = 0;
        totalCost = 0;
        updateSessionStats();
    }
</script>

</body>
</html>
